[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-infra-automation"
version = "0.1.0"
description = "Python SDK for the VegaTrade trading API with infrastructure automation helpers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Rafael Mejia Aguilar" },
]
license = { text = "MIT" }
keywords = ["trading", "vega-trade", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Office/Business :: Financial",
]

dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rafaelmejiaaguilar691-sudo/trading-infra-automation"
Repository = "https://github.com/rafaelmejiaaguilar691-sudo/trading-infra-automation"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
